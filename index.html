<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b3a">
<link rel="manifest" href="manifest.json">
<title>TECMAZ Automação</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#172033}
.app{min-height:100vh}.top{background:#071b3a;color:#fff;padding:18px 18px 22px;border-bottom:4px solid #f2c400}
.brand{font-weight:800;letter-spacing:1px;font-size:22px}.sub{opacity:.78;font-size:13px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:18px}.welcome{background:#071b3a;color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
.welcome h1{margin:0 0 7px;font-size:25px}.welcome p{margin:0;color:#d9e1ef}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.action{border:0;border-radius:14px;padding:15px;background:#f2c400;color:#071b3a;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0000000d;border:1px solid #e6e9ef}
.card .label{font-size:13px;color:#667085}.number{font-size:28px;font-weight:800;margin-top:8px}
.section{font-size:18px;font-weight:800;margin:24px 0 12px}
.attention{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{color:#667085;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:10}
nav button{border:0;background:none;padding:12px 18px;color:#667085;font-weight:700;cursor:pointer}
nav button.active{color:#071b3a}.content{padding-bottom:85px}
@media(max-width:700px){main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}.attention{grid-template-columns:1fr}.card{padding:15px}.number{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">TECMAZ AUTOMAÇÃO</div><div class="sub">Gestão de serviços e manutenção</div></header>
<div class="content"><main id="app"></main></div>
<nav>
<button class="active" onclick="showHome(this)">Início</button>
<button onclick="coming('Clientes',this)">Clientes</button>
<button onclick="coming('OS',this)">OS</button>
<button onclick="coming('Caixa',this)">Caixa</button>
<button onclick="coming('Mais',this)">Mais</button>
</nav>
</div>
<script>
function showHome(btn){
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 document.getElementById('app').innerHTML=`
 <section class="welcome">
   <h1>Olá! 👋</h1>
   <p>Bem-vindo ao novo sistema da Tecmaz Automação.</p>
   <div class="actions">
    <button class="action" onclick="coming('Nova OS',null)">+ Nova OS</button>
    <button class="action" onclick="coming('Novo Cliente',null)">+ Cliente</button>
    <button class="action" onclick="coming('Orçamento',null)">Orçamento</button>
   </div>
 </section>
 <div class="grid">
  <div class="card"><div class="label">OS abertas</div><div class="number">0</div></div>
  <div class="card"><div class="label">Aguardando aprovação</div><div class="number">0</div></div>
  <div class="card"><div class="label">Aguardando pagamento</div><div class="number">0</div></div>
  <div class="card"><div class="label">A receber</div><div class="number">R$ 0,00</div></div>
 </div>
 <div class="section">Atenção</div>
 <div class="attention">
  <div class="card"><div class="label">Vencidos</div><div class="number">R$ 0,00</div><div class="empty">Nenhum lançamento vencido.</div></div>
  <div class="card"><div class="label">Serviços recentes</div><div class="empty" style="margin-top:12px">Nenhuma OS cadastrada ainda.</div></div>
 </div>
 <div class="section">Resumo do caixa</div>
 <div class="grid">
  <div class="card"><div class="label">Entradas</div><div class="number">R$ 0,00</div></div>
  <div class="card"><div class="label">Saídas</div><div class="number">R$ 0,00</div></div>
  <div class="card"><div class="label">Saldo</div><div class="number">R$ 0,00</div></div>
  <div class="card"><div class="label">A pagar</div><div class="number">R$ 0,00</div></div>
 </div>`;
}
function coming(name,btn){
 if(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
 document.getElementById('app').innerHTML=`<section class="card"><h2>${name}</h2><p class="empty">Esta área será construída na próxima etapa. A base nova está funcionando.</p><button class="action" onclick="showHome(document.querySelector('nav button'))">Voltar ao Início</button></section>`;
}
showHome(document.querySelector('nav button'));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
