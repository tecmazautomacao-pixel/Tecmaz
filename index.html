:5px}.finance-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter-row{display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:8px}.modal-back{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal-card{background:#fff;border-radius:18px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.os-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.os-full{grid-column:1/-1}.empty{padding:20px;text-align:center;color:#687983}@media(max-width:800px){.home-cards{grid-template-columns:repeat(2,1fr)}.home-columns{grid-template-columns:1fr}.finance-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.home-cards,.quick-grid,.detail-grid,.os-detail-grid{grid-template-columns:1fr 1fr}.filter-row{grid-template-columns:1fr}.finance-grid{grid-template-columns:1fr 1fr}.page-head{padding:15px}.home-banner{padding:18px}.home-banner b{font-size:21px}}
</style></head><body><div id="login" class="login-wrap"></div><header id="header" class="hidden"><div class="brand">⚙ TECMAZ <span>AUTOMAÇÃO</span></div><div class="sub">MANUTENÇÃO EM INVERSORES, SOFT STARTERS E AUTOMAÇÃO INDUSTRIAL</div></header><main id="app" class="hidden"></main><nav id="nav" class="hidden"><button onclick="goScreen('home')"><b>⌂</b>Início</button><button onclick="goScreen('clientes')"><b>♙</b>Clientes</button><button onclick="goScreen('ordens')"><b>⚒</b>OS</button><button onclick="goScreen('financeiro')"><b>▣</b>Caixa</button><button onclick="goScreen('mais')"><b>☰</b>Mais</button></nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://dpkykuriwzoqotbsdsob.supabase.co','sb_publishable_hI8aJKSdaqBkPuNXCgJCog_Fvu42H22');
const app=document.getElementById('app'),login=document.getElementById('login'); let session=null,db={clientes:[],equipamentos:[],os:[],orcamentos:[],financeiro:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10);
const statuses=['Em execução','Aguardando aprovação','Aguardando pagamento','Finalizada','Cancelada'];
const statusCls=s=>({Finalizada:'green','Aguardando pagamento':'orange','Aguardando aprovação':'purple','Cancelada':'red','Em execução':'orange'}[s]||'');
const parseMeta=o=>{try{let x=JSON.parse(o?.observacoes||'');return x&&typeof x==='object'?x:{}}catch{return {}}};
const saveMeta=(o,extra)=>{let m=parseMeta(o);return JSON.stringify({...m,...extra})};
async function loadDB(){const [c,e,o,q,f]=await Promise.all([supabase.from('clientes').select('*').order('created_at',{ascending:false}),supabase.from('equipamentos').select('*').order('created_at',{ascending:false}),supabase.from('ordens_servico').select('*').order('numero',{ascending:false}),supabase.from('orcamentos').select('*').order('created_at',{ascending:false}),supabase.from('financeiro').select('*').order('created_at',{ascending:false})]);for(const r of [c,e,o,q,f])if(r.error)throw r.error;db={clientes:c.data||[],equipamentos:e.data||[],os:o.data||[],orcamentos:q.data||[],financeiro:f.data||[]}}
function showApp(){login.classList.add('hidden');['header','app','nav'].forEach(x=>$(x).classList.remove('hidden'))} function showLogin(){['header','app','nav'].forEach(x=>$(x).classList.add('hidden'));login.classList.remove('hidden');login.innerHTML='<div class="login-card"><div class="brand">⚙ TECMAZ <span>AUTOMAÇÃO</span></div><div class="sub">Sistema de gestão online</div><h2 id="authTitle">Entrar</h2><label>E-mail</label><input id="authEmail" type="email"><label>Senha</label><input id="authPass" type="password"><button class="btn yellow full" id="authBtn" onclick="entrar()">Entrar</button><button class="btn light full" onclick="mostrarCadastro()">Criar acesso</button><div id="authMsg" class="small"></div></div>'}
window.mostrarCadastro=()=>{$('authTitle').textContent='Criar acesso';$('authBtn').textContent='Criar conta';$('authBtn').onclick=cadastrar};window.entrar=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPass').value});if(error)$('authMsg').textContent=error.message};window.cadastrar=async()=>{const email=$('authEmail').value.trim(),password=$('authPass').value;if(password.length<6)return $('authMsg').textContent='Use uma senha com pelo menos 6 caracteres.';const {error}=await supabase.auth.signUp({email,password});$('authMsg').textContent=error?error.message:'Conta criada. Confirme o e-mail se solicitado.'};window.sair=async()=>supabase.auth.signOut();
function cliente(id){return db.clientes.find(x=>x.id===id)} function equip(id){return db.equipamentos.find(x=>x.id===id)}
function home(){
  const open=db.os.filter(o=>!['Finalizada','Cancelada'].includes(o.status)).length;
  const approval=db.os.filter(o=>o.status==='Aguardando aprovação').length;
  const waiting=db.os.filter(o=>o.status==='Aguardando pagamento').length;
  const receiving=db.financeiro.filter(x=>x.tipo==='Receber'&&x.status!=='Pago').reduce((a,x)=>a+Number(x.valor||0),0);
  const payable=db.financeiro.filter(x=>x.tipo==='Pagar'&&x.status!=='Pago').reduce((a,x)=>a+Number(x.valor||0),0);
  const ent=db.financeiro.filter(x=>x.tipo==='Receber'&&x.status==='Pago').reduce((a,x)=>a+Number(x.valor||0),0);
  const sa=db.financeiro.filter(x=>x.tipo==='Pagar'&&x.status==='Pago').reduce((a,x)=>a+Number(x.valor||0),0);
  const recent=[...db.os].sort((a,b)=>String(b.created_at||b.data||'').localeCompare(String(a.created_at||a.data||''))).slice(0,6);
  app.innerHTML=`<div class="home-new">
    <div class="home-banner"><b>Olá! 👋</b><small>Bem-vindo ao painel da Tecmaz Automação</small><div style="margin-top:14px" class="toolbar"><button class="btn yellow" onclick="novaOS()">＋ Nova OS</button><button class="btn light" onclick="novoCliente()">＋ Cliente</button><button class="btn light" onclick="financeiro()">▣ Caixa</button></div></div>
    <div class="home-cards"><div class="home-card"><div class="small">OS abertas</div><div class="n">${open}</div></div><div class="home-card"><div class="small">Aguardando aprovação</div><div class="n">${approval}</div></div><div class="home-card"><div class="small">Aguardando pagamento</div><div class="n">${waiting}</div></div><div class="home-card"><div class="small">A receber</div><div class="n money-open">${money(receiving)}</div></div></div>
    <div class="quick-grid"><button class="quick" onclick="novaOS()"><b>⚒</b>Nova Ordem de Serviço</button><button class="quick" onclick="clientes()"><b>♙</b>Clientes e equipamentos</button><button class="quick" onclick="financeiro()"><b>▣</b>Controle financeiro</button></div>
    <div class="home-columns"><div class="section-card"><h3>OS recentes</h3>${recent.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${esc(cliente(o.cliente_id)?.nome||'-')} • ${esc(o.data||'')}</span></div><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<div class="empty">Nenhuma OS cadastrada.</div>'}</div>
    <div class="section-card"><h3>Resumo do caixa</h3><div class="detail-grid"><div class="detail-box"><div class="lbl">Entradas pagas</div><div class="val money-in">${money(ent)}</div></div><div class="detail-box"><div class="lbl">Saídas pagas</div><div class="val money-out">${money(sa)}</div></div><div class="detail-box"><div class="lbl">Saldo</div><div class="val">${money(ent-sa)}</div></div><div class="detail-box"><div class="lbl">A pagar</div><div class="val money-out">${money(payable)}</div></div></div><button class="btn light full" onclick="financeiro()">Abrir Caixa completo</button></div></div>
  </div>`;
}

function clientes(){app.innerHTML='<div class="row"><h2>Clientes</h2><button class="btn yellow" onclick="novoCliente()">＋</button></div><input placeholder="🔎 Pesquisar cliente..." oninput="filtraClientes(this.value)"><div id="clist" class="list"></div>';filtraClientes('')}
window.goScreen=s=>{history.pushState({tecmazScreen:s},'',location.pathname+location.search+'#'+s);({home,clientes,ordens,financeiro,mais}[s]||home)()};window.home=home;window.clientes=clientes;
function filtraClientes(q){const s=(q||'').toLowerCase();const a=db.clientes.filter(c=>(c.nome+' '+(c.cpf_cnpj||'')+' '+(c.telefone||'')+' '+(c.cidade||'')).toLowerCase().includes(s));$('clist').innerHTML=a.map(c=>`<div class="item" onclick="verCliente('${c.id}')"><div><b>${esc(c.nome)}</b><br><span class="small">${esc(c.telefone||'-')} • ${esc(c.cidade||'')}</span></div><span>›</span></div>`).join('')||'<div class="card small">Nenhum cliente encontrado.</div>'}
function novoCliente(id=null){const c=id?cliente(id):null;app.innerHTML=`<div class="row"><h2>${c?'Editar Cliente':'Novo Cliente'}</h2><button class="btn light" onclick="clientes()">Voltar</button></div><div class="card"><label>Tipo</label><select id="ctipo"><option value="PF">Pessoa Física</option><option value="PJ">Pessoa Jurídica</option></select><label>Nome/Razão social *</label><input id="cnome"><label>CPF/CNPJ</label><input id="ccnpj"><label>Telefone/WhatsApp</label><input id="ctel"><label>E-mail</label><input id="cemail"><label>Endereço</label><input id="cend"><div class="grid"><div><label>Cidade</label><input id="ccidade"></div><div><label>UF</label><input id="cuf" maxlength="2"></div></div><label>Observações</label><textarea id="cobs" rows="3"></textarea><button class="btn yellow full" onclick="salvarCliente(${id?`'${id}'`:'null'})">${c?'Salvar alterações':'Salvar cliente'}</button></div>`;if(c){$('ctipo').value=c.tipo||'PF';$('cnome').value=c.nome||'';$('ccnpj').value=c.cpf_cnpj||'';$('ctel').value=c.telefone||'';$('cemail').value=c.email||'';$('cend').value=c.endereco||'';$('ccidade').value=c.cidade||'';$('cuf').value=c.uf||'';$('cobs').value=c.observacoes||''}}
window.salvarCliente=async id=>{const nome=$('cnome').value.trim();if(!nome)return alert('Informe o nome.');const payload={tipo:$('ctipo').value,nome,cpf_cnpj:$('ccnpj').value.trim(),telefone:$('ctel').value.trim(),email:$('cemail').value.trim(),endereco:$('cend').value.trim(),cidade:$('ccidade').value.trim(),uf:$('cuf').value.trim().toUpperCase(),observacoes:$('cobs').value.trim()};const {error}=id?await supabase.from('clientes').update(payload).eq('id',id):await supabase.from('clientes').insert(payload);if(error)return alert(error.message);await loadDB();clientes()};window.editarCliente=id=>novoCliente(id);
window.verCliente=async id=>{await loadDB();const c=cliente(id),eqs=db.equipamentos.filter(e=>e.cliente_id===id),os=db.os.filter(o=>o.cliente_id===id);app.innerHTML=`<div class="row"><h2>${esc(c.nome)}</h2><div style="display:flex;gap:6px"><button class="btn yellow" onclick="editarCliente('${id}')">Editar</button><button class="btn light" onclick="clientes()">Voltar</button></div></div><div class="card"><b>${esc(c.telefone||'-')}</b><br><span class="small">${esc(c.email||'-')}<br>${esc(c.endereco||'')} ${esc(c.cidade||'')} ${esc(c.uf||'')}</span></div><div class="row"><h3>Equipamentos</h3><button class="btn yellow" onclick="novoEquipamento('${id}')">＋</button></div><div class="list">${eqs.map(e=>`<div class="item"><div><b>${esc(e.fabricante||'')} ${esc(e.modelo||'')}</b><br><span class="small">${esc(e.tipo||'')} • ${esc(e.potencia||'')} • ${esc(e.tensao||'')} • SN ${esc(e.numero_serie||'-')}</span></div><button class="btn light" type="button" onclick="editarEquipamento('${e.id}')">Editar</button></div>`).join('')||'<div class="card small">Nenhum equipamento cadastrado.</div>'}</div><h3 style="margin-top:18px">Histórico de OS</h3><div class="list">${os.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${o.data||''}</span></div><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<div class="card small">Nenhuma OS.</div>'}</div>`}

function itemRow(i={},n=1){
  const d=String(i.descricao||'');
  const v=Number(i.valor||0);
  const q=Number(i.qtd||1);
  return `<div class="osq osq-compact" data-desc="${esc(d)}" data-val="${v}" data-qty="${q}">
    <div class="osq-num">${n}</div>
    <div class="osq-text" title="${esc(d)}">${esc(d)||'<span class="small">Novo item</span>'}</div>
    <div class="osq-value">${money(v)}</div>
    <div class="osq-qty">${q}</div>
    <div class="osq-actions"><button type="button" class="osq-edit" onclick="editarItemOS(this)">Editar</button></div>
    <div class="osq-actions"><button type="button" class="osq-remove" onclick="removerItemOS(this)">Remover</button></div>
  </div>`;
}
let osDraftEditIndex=-1;
function currentOSItems(){
  return Array.from(document.querySelectorAll('#osqitems .osq-compact')).map(r=>({
    descricao:r.dataset.desc||'', valor:Number(r.dataset.val||0), qtd:Number(r.dataset.qty||1)
  }));
}
function renderOSItems(){
  const box=$('osqitems'); if(!box)return;
  const items=currentOSItems();
  box.innerHTML=(items.length?`<div class="osq-compact head"><div>Item</div><div>Descrição</div><div>Valor unitário</div><div>Quantidade</div><div>Ações</div><div></div></div>`:'')+items.map((x,i)=>itemRow(x,i+1)).join('');
  $('osqempty').style.display=items.length?'none':'block';
  recalcOS();
}
function recalcOS(){
  const total=currentOSItems().reduce((s,x)=>s+Number(x.valor||0)*Number(x.qtd||0),0);
  const t=$('ostotal'); if(t)t.textContent='Total: '+money(total);
}
function adicionarItemOS(){
  const d=$('draftDesc')?.value.trim();
  const v=Number($('draftVal')?.value||0);
  const q=Number($('draftQty')?.value||1);
  if(!d)return alert('Informe a descrição do item.');
  if(q<=0)return alert('A quantidade deve ser maior que zero.');
  const box=$('osqitems'); if(!box)return;
  const items=currentOSItems();
  if(osDraftEditIndex>=0){
    items[osDraftEditIndex]={descricao:d,valor:v,qtd:q};
    osDraftEditIndex=-1;
  }else items.push({descricao:d,valor:v,qtd:q});
  box.innerHTML='';
  items.forEach((x,i)=>box.insertAdjacentHTML('beforeend',itemRow(x,i+1)));
  $('draftDesc').value=''; $('draftVal').value='0'; $('draftQty').value='1';
  const b=$('draftBtn'); if(b)b.textContent='＋ Mais itens';
  $('osqempty').style.display=items.length?'none':'block';
  recalcOS();
}
function editarItemOS(btn){
  const row=btn.closest('.osq-compact'); if(!row)return;
  const rows=Array.from(document.querySelectorAll('#osqitems .osq-compact:not(.head)'));
  osDraftEditIndex=rows.indexOf(row);
  $('draftDesc').value=row.dataset.desc||'';
  $('draftVal').value=row.dataset.val||0;
  $('draftQty').value=row.dataset.qty||1;
  const b=$('draftBtn'); if(b)b.textContent='✓ Atualizar item';
  $('draftDesc').focus();
}
function removerItemOS(btn){
  const row=btn.closest('.osq-compact'); if(!row)return;
  row.remove();
  osDraftEditIndex=-1;
  const b=$('draftBtn'); if(b)b.textContent='＋ Mais itens';
  $('osqempty').style.display=document.querySelectorAll('#osqitems .osq-compact:not(.head)').length?'none':'block';
  recalcOS();
}
window.adicionarItemOS=adicionarItemOS; window.editarItemOS=editarItemOS; window.removerItemOS=removerItemOS;
function coletarItensOS(){return currentOSItems();}

window.atualizaClienteOS=()=>{const cid=$('ocliente')?.value,info=$('oclienteinfo');if(!info)return;const c=cliente(cid);info.innerHTML=c?`<b>${esc(c.nome)}</b><br><span class="small">${esc(c.telefone||'Sem telefone')} • ${esc(c.email||'Sem e-mail')}<br>${esc(c.endereco||'')} ${esc(c.cidade||'')} ${esc(c.uf||'')}</span>`:'<span class="small">Nenhum cliente selecionado.</span>';const sel=$('oeqid');if(!sel)return;const eqs=cid?db.equipamentos.filter(e=>e.cliente_id===cid):[];const current=sel.value;sel.innerHTML='<option value="">— Novo / preencher abaixo —</option>'+eqs.map(e=>`<option value="${e.id}">${esc((e.tipo||'')+' '+(e.fabricante||'')+' '+(e.modelo||''))} — SN ${esc(e.numero_serie||'-')}</option>`).join('');if(eqs.some(e=>e.id===current))sel.value=current;preencherEquipamentoOS()};
