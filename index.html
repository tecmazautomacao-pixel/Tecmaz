<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2d42"><title>Tecmaz Automação</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#163244}header{background:#0b2d42;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.brand span{color:#ffc400}.sub{font-size:11px;opacity:.88;margin-top:4px}main{max-width:800px;margin:auto;padding:16px 14px 100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0000000b;margin-bottom:12px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:#0b2d42;color:#fff}.btn.yellow{background:#ffc400;color:#172b38}.btn.light{background:#e9eff3;color:#163244}.btn.danger{background:#ffe1e1;color:#8b1e1e}.btn.full{width:100%;margin:7px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;padding:13px;border-radius:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 2px 8px #00000009}.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#e8eef2;white-space:nowrap}.green{background:#d9f5df;color:#18702b}.orange{background:#fff0c8;color:#8a5b00}.blue{background:#dcecff;color:#15589a}.red{background:#ffdede;color:#9a2222}.purple{background:#eee2ff;color:#6339a5}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:6}nav button{flex:1;max-width:160px;background:none;border:0;padding:9px 3px;font-size:11px;color:#163244}nav button b{display:block;font-size:19px}input,select,textarea{width:100%;padding:11px;border:1px solid #d4dde2;border-radius:9px;margin:5px 0 11px;font:inherit;background:#fff}label{font-size:12px;font-weight:700}h2{margin:8px 0 14px;font-size:20px}h3{margin:5px 0 8px}.small{font-size:12px;color:#687983}.section-title{font-weight:800;font-size:14px;margin:15px 0 8px}.item-box{border:1px solid #dbe2e6;border-radius:12px;padding:10px;background:#fafcfd;margin-bottom:10px}.quote-head{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.status-btn{border:1px solid #d4dde2;background:#fff;border-radius:10px;padding:11px;font-weight:700;color:#425563}.status-btn.active{outline:3px solid #ffc400;background:#fff9d6}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:12px;padding:13px;box-shadow:0 2px 8px #00000009}.stat .n{font-size:19px;font-weight:800;margin-top:4px}.money-in{color:#19733a}.money-out{color:#a52929}.money-open{color:#15589a}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{background:#0b2d42;color:#fff;padding:9px;text-align:left;font-size:12px}.table td{padding:8px;border-bottom:1px solid #e5eaed;font-size:13px;vertical-align:top}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f6f8}.login-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}.hidden{display:none}@media(max-width:600px){.grid,.quote-head{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.status-grid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="login" class="login-wrap"></div><header id="header" class="hidden"><div class="brand">⚙ TECMAZ <span>AUTOMAÇÃO</span></div><div class="sub">MANUTENÇÃO EM INVERSORES, SOFT STARTERS E AUTOMAÇÃO INDUSTRIAL</div></header><main id="app" class="hidden"></main><nav id="nav" class="hidden"><button onclick="home()"><b>⌂</b>Início</button><button onclick="clientes()"><b>♙</b>Clientes</button><button onclick="ordens()"><b>⚒</b>OS</button><button onclick="financeiro()"><b>▣</b>Caixa</button><button onclick="mais()"><b>☰</b>Mais</button></nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://dpkykuriwzoqotbsdsob.supabase.co','sb_publishable_hI8aJKSdaqBkPuNXCgJCog_Fvu42H22');
const app=document.getElementById('app'),login=document.getElementById('login'); let session=null,db={clientes:[],equipamentos:[],os:[],orcamentos:[],financeiro:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10);
const statuses=['Em execução','Aguardando peça','Aguardando instalação','Aguardando aprovação','Finalizada','Cancelada'];
const statusCls=s=>({Finalizada:'green','Aguardando peça':'orange','Aguardando instalação':'blue','Aguardando aprovação':'purple','Cancelada':'red','Em execução':'orange'}[s]||'');
const parseMeta=o=>{try{let x=JSON.parse(o?.observacoes||'');return x&&typeof x==='object'?x:{}}catch{return {}}};
const saveMeta=(o,extra)=>{let m=parseMeta(o);return JSON.stringify({...m,...extra})};
async function loadDB(){const [c,e,o,q,f]=await Promise.all([supabase.from('clientes').select('*').order('created_at',{ascending:false}),supabase.from('equipamentos').select('*').order('created_at',{ascending:false}),supabase.from('ordens_servico').select('*').order('numero',{ascending:false}),supabase.from('orcamentos').select('*').order('created_at',{ascending:false}),supabase.from('financeiro').select('*').order('created_at',{ascending:false})]);for(const r of [c,e,o,q,f])if(r.error)throw r.error;db={clientes:c.data||[],equipamentos:e.data||[],os:o.data||[],orcamentos:q.data||[],financeiro:f.data||[]}}
function showApp(){login.classList.add('hidden');['header','app','nav'].forEach(x=>$(x).classList.remove('hidden'))} function showLogin(){['header','app','nav'].forEach(x=>$(x).classList.add('hidden'));login.classList.remove('hidden');login.innerHTML='<div class="login-card"><div class="brand">⚙ TECMAZ <span>AUTOMAÇÃO</span></div><div class="sub">Sistema de gestão online</div><h2 id="authTitle">Entrar</h2><label>E-mail</label><input id="authEmail" type="email"><label>Senha</label><input id="authPass" type="password"><button class="btn yellow full" id="authBtn" onclick="entrar()">Entrar</button><button class="btn light full" onclick="mostrarCadastro()">Criar acesso</button><div id="authMsg" class="small"></div></div>'}
window.mostrarCadastro=()=>{$('authTitle').textContent='Criar acesso';$('authBtn').textContent='Criar conta';$('authBtn').onclick=cadastrar};window.entrar=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPass').value});if(error)$('authMsg').textContent=error.message};window.cadastrar=async()=>{const email=$('authEmail').value.trim(),password=$('authPass').value;if(password.length<6)return $('authMsg').textContent='Use uma senha com pelo menos 6 caracteres.';const {error}=await supabase.auth.signUp({email,password});$('authMsg').textContent=error?error.message:'Conta criada. Confirme o e-mail se solicitado.'};window.sair=async()=>supabase.auth.signOut();
function cliente(id){return db.clientes.find(x=>x.id===id)} function equip(id){return db.equipamentos.find(x=>x.id===id)}
function home(){const open=db.os.filter(o=>o.status!=='Finalizada'&&o.status!=='Cancelada').length,done=db.os.filter(o=>o.status==='Finalizada').length,receber=db.financeiro.filter(x=>x.tipo==='Receber'&&x.status!=='Pago').reduce((s,x)=>s+Number(x.valor||0),0);app.innerHTML=`<h2>Início</h2><div class="stat-grid"><div class="stat"><div class="small">OS abertas</div><div class="n">${open}</div></div><div class="stat"><div class="small">Finalizadas</div><div class="n">${done}</div></div><div class="stat"><div class="small">A receber</div><div class="n money-open">${money(receber)}</div></div></div><div class="card"><h3>Atalhos</h3><div class="actions"><button class="btn yellow" onclick="novaOS()">＋ Nova OS</button><button class="btn" onclick="clientes()">Clientes</button><button class="btn" onclick="orcamentos()">Orçamentos</button><button class="btn" onclick="financeiro()">Caixa</button></div></div>`}
function clientes(){app.innerHTML='<div class="row"><h2>Clientes</h2><button class="btn yellow" onclick="novoCliente()">＋</button></div><input placeholder="🔎 Pesquisar cliente..." oninput="filtraClientes(this.value)"><div id="clist" class="list"></div>';filtraClientes('')}
function filtraClientes(q){const s=(q||'').toLowerCase();const a=db.clientes.filter(c=>(c.nome+' '+(c.cpf_cnpj||'')+' '+(c.telefone||'')+' '+(c.cidade||'')).toLowerCase().includes(s));$('clist').innerHTML=a.map(c=>`<div class="item" onclick="verCliente('${c.id}')"><div><b>${esc(c.nome)}</b><br><span class="small">${esc(c.telefone||'-')} • ${esc(c.cidade||'')}</span></div><span>›</span></div>`).join('')||'<div class="card small">Nenhum cliente encontrado.</div>'}
function novoCliente(){app.innerHTML='<div class="row"><h2>Novo Cliente</h2><button class="btn light" onclick="clientes()">Voltar</button></div><div class="card"><label>Tipo</label><select id="ctipo"><option value="PF">Pessoa Física</option><option value="PJ">Pessoa Jurídica</option></select><label>Nome/Razão social *</label><input id="cnome"><label>CPF/CNPJ</label><input id="ccnpj"><label>Telefone/WhatsApp</label><input id="ctel"><label>E-mail</label><input id="cemail"><label>Endereço</label><input id="cend"><div class="grid"><div><label>Cidade</label><input id="ccidade"></div><div><label>UF</label><input id="cuf" maxlength="2"></div></div><label>Observações</label><textarea id="cobs" rows="3"></textarea><button class="btn yellow full" onclick="salvarCliente()">Salvar cliente</button></div>'}
window.salvarCliente=async()=>{const nome=$('cnome').value.trim();if(!nome)return alert('Informe o nome.');const {error}=await supabase.from('clientes').insert({tipo:$('ctipo').value,nome,cpf_cnpj:$('ccnpj').value.trim(),telefone:$('ctel').value.trim(),email:$('cemail').value.trim(),endereco:$('cend').value.trim(),cidade:$('ccidade').value.trim(),uf:$('cuf').value.trim().toUpperCase(),observacoes:$('cobs').value.trim()});if(error)return alert(error.message);await loadDB();clientes()};
window.verCliente=async id=>{await loadDB();const c=cliente(id),eqs=db.equipamentos.filter(e=>e.cliente_id===id),os=db.os.filter(o=>o.cliente_id===id);app.innerHTML=`<div class="row"><h2>${esc(c.nome)}</h2><button class="btn light" onclick="clientes()">Voltar</button></div><div class="card"><b>${esc(c.telefone||'-')}</b><br><span class="small">${esc(c.email||'-')}<br>${esc(c.endereco||'')} ${esc(c.cidade||'')} ${esc(c.uf||'')}</span></div><div class="row"><h3>Equipamentos</h3><button class="btn yellow" onclick="novoEquipamento('${id}')">＋</button></div><div class="list">${eqs.map(e=>`<div class="item"><div><b>${esc(e.fabricante||'')} ${esc(e.modelo||'')}</b><br><span class="small">${esc(e.tipo||'')} • ${esc(e.potencia||'')} • ${esc(e.tensao||'')} • SN ${esc(e.numero_serie||'-')}</span></div></div>`).join('')||'<div class="card small">Nenhum equipamento cadastrado.</div>'}</div><h3 style="margin-top:18px">Histórico de OS</h3><div class="list">${os.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${o.data||''}</span></div><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<div class="card small">Nenhuma OS.</div>'}</div>`}
function novoEquipamento(clienteId){app.innerHTML=`<div class="row"><h2>Novo Equipamento</h2><button class="btn light" onclick="verCliente('${clienteId}')">Voltar</button></div><div class="card"><div class="small">Cliente: <b>${esc(cliente(clienteId)?.nome)}</b></div><label>Tipo *</label><input id="etipo"><label>Fabricante</label><input id="efab"><label>Modelo</label><input id="emod"><div class="grid"><div><label>Potência</label><input id="epot"></div><div><label>Tensão</label><input id="eten"></div></div><label>Nº de série</label><input id="eserie"><label>Local instalado</label><input id="elocal"><label>Observações</label><textarea id="eobs" rows="3"></textarea><button class="btn yellow full" onclick="salvarEquipamento('${clienteId}')">Salvar equipamento</button></div>`}window.novoEquipamento=novoEquipamento;window.salvarEquipamento=async cid=>{if(!$('etipo').value.trim())return alert('Informe o tipo.');const {error}=await supabase.from('equipamentos').insert({cliente_id:cid,tipo:$('etipo').value.trim(),fabricante:$('efab').value.trim(),modelo:$('emod').value.trim(),potencia:$('epot').value.trim(),tensao:$('eten').value.trim(),numero_serie:$('eserie').value.trim(),local_instalacao:$('elocal').value.trim(),observacoes:$('eobs').value.trim()});if(error)return alert(error.message);await loadDB();verCliente(cid)};
function itemRow(i={},n=1){return `<div class="item-box osq"><div class="grid"><div><label>Descrição</label><input class="qdesc" value="${esc(i.descricao||'')}" placeholder="Ex.: Mão de obra, peça, deslocamento..."></div><div><label>Valor unitário</label><input class="qval" type="number" step="0.01" value="${Number(i.valor||0)}"></div></div><div class="row"><div style="flex:1"><label>Quantidade</label><input class="qqtd" type="number" step="0.01" value="${Number(i.qtd||1)}"></div><button class="btn danger" style="margin-left:8px" onclick="this.closest('.osq').remove();recalcOS()">Remover</button></div></div>`}
function novaOS(clienteId=''){const eqs=clienteId?db.equipamentos.filter(e=>e.cliente_id===clienteId):[];app.innerHTML=`<div class="row"><h2>Nova Ordem de Serviço</h2><button class="btn light" onclick="ordens()">Voltar</button></div><div class="card"><label>Cliente *</label><select id="ocliente" onchange="atualizaEquipamentosOS()"><option value="">Selecione</option>${db.clientes.map(c=>`<option value="${c.id}" ${c.id===clienteId?'selected':''}>${esc(c.nome)}</option>`).join('')}</select><label>Equipamento</label><select id="oeqid"><option value="">— Selecione —</option>${eqs.map(e=>`<option value="${e.id}">${esc(e.tipo||'')} ${esc(e.fabricante||'')} ${esc(e.modelo||'')} — SN ${esc(e.numero_serie||'-')}</option>`).join('')}</select><label>Local</label><select id="olocal"><option>Cliente</option><option>Oficina</option></select><label>Endereço / referência</label><input id="oend"><label>Tipo de serviço</label><input id="otipo"><label>Defeito relatado</label><textarea id="odef" rows="3"></textarea><label>Diagnóstico</label><textarea id="odiag" rows="4"></textarea></div><div class="card"><div class="section-title">Status</div><div class="status-grid" id="statusGrid">${statuses.map((s,i)=>`<button type="button" class="status-btn ${i===0?'active':''}" data-status="${s}" onclick="selecionarStatusOS('${s}')">${s}</button>`).join('')}</div><input type="hidden" id="ostatus" value="Em execução"></div><div class="card"><div class="row"><div><div class="section-title" style="margin-top:0">Orçamento desta OS</div><div class="small">Use somente estas linhas para peças, mão de obra, deslocamento ou qualquer outro item.</div></div><button class="btn yellow" onclick="adicionarItemOS()">＋ Item</button></div><div id="osqitems" style="margin-top:10px">${itemRow({},1)}</div><div id="ostotal" style="text-align:right;font-size:18px;font-weight:800">Total: R$ 0,00</div></div><div class="card"><label>Observações / condições</label><textarea id="ocond" rows="3"></textarea><label>Salvar equipamento no cadastro do cliente</label><input id="osaveeq" type="checkbox"><button class="btn yellow full" onclick="salvarOS()">Salvar OS</button></div>`;recalcOS()}
window.novaOS=novaOS;window.atualizaEquipamentosOS=()=>{const cid=$('ocliente').value,sel=$('oeqid');sel.innerHTML='<option value="">— Selecione —</option>'+db.equipamentos.filter(e=>e.cliente_id===cid).map(e=>`<option value="${e.id}">${esc(e.tipo||'')} ${esc(e.fabricante||'')} ${esc(e.modelo||'')} — SN ${esc(e.numero_serie||'-')}</option>`).join('')};window.selecionarStatusOS=s=>{document.querySelectorAll('.status-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===s));$('ostatus').value=s};window.adicionarItemOS=()=>{$('osqitems').insertAdjacentHTML('beforeend',itemRow());recalcOS()};window.recalcOS=()=>{let t=0;document.querySelectorAll('.osq').forEach(r=>t+=Number(r.querySelector('.qval')?.value||0)*Number(r.querySelector('.qqtd')?.value||0));if($('ostotal'))$('ostotal').textContent='Total: '+money(t)};window.coletarItensOS=()=>Array.from(document.querySelectorAll('#osqitems .osq')).map(r=>({descricao:r.querySelector('.qdesc').value.trim(),valor:Number(r.querySelector('.qval').value||0),qtd:Number(r.querySelector('.qqtd').value||1)})).filter(x=>x.descricao||x.valor);
window.salvarOS=async()=>{const cid=$('ocliente').value;if(!cid)return alert('Selecione um cliente.');const itens=coletarItensOS();const total=itens.reduce((s,x)=>s+x.valor*x.qtd,0);let meta={contato:cliente(cid)?.telefone||'',condicoes:$('ocond').value.trim(),orcamento_itens:itens};const {data,error}=await supabase.from('ordens_servico').insert({cliente_id:cid,equipamento_id:$('oeqid').value||null,data:today(),local:$('olocal').value,endereco:$('oend').value.trim(),tipo_servico:$('otipo').value.trim(),defeito:$('odef').value.trim(),diagnostico:$('odiag').value.trim(),status:$('ostatus').value,pecas:0,mao_de_obra:0,deslocamento:0,outros:0,observacoes:JSON.stringify(meta)}).select().single();if(error)return alert(error.message);await loadDB();verOS(data.id)};
function osItens(o){const m=parseMeta(o);return Array.isArray(m.orcamento_itens)?m.orcamento_itens:[]}
window.verOS=async id=>{await loadDB();const o=db.os.find(x=>x.id===id);if(!o)return ordens();const c=cliente(o.cliente_id),e=equip(o.equipamento_id),items=osItens(o),total=items.reduce((s,x)=>s+Number(x.valor||0)*Number(x.qtd||0),0);app.innerHTML=`<div class="row"><h2>OS ${String(o.numero).padStart(5,'0')}</h2><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div><div class="card"><b>${esc(c?.nome||'-')}</b><br><span class="small">${esc(c?.telefone||'-')}<br>${esc(e?.fabricante||'')} ${esc(e?.modelo||'')} • SN ${esc(e?.numero_serie||'-')}</span></div><div class="card"><div class="section-title">Defeito relatado</div><div>${esc(o.defeito||'-').replace(/\n/g,'<br>')}</div><div class="section-title">Diagnóstico</div><div>${esc(o.diagnostico||'-').replace(/\n/g,'<br>')}</div></div><div class="card"><div class="section-title">Orçamento desta OS</div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Descrição</th><th>Valor unitário</th><th>Quantidade</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.descricao||'')}</td><td>${money(x.valor)}</td><td>${x.qtd}</td></tr>`).join('')||'<tr><td colspan="4">Nenhum item</td></tr>'}</tbody></table></div><div style="text-align:right;font-size:19px;font-weight:800;margin-top:10px">Total: ${money(total)}</div></div><div class="card"><div class="section-title">Alterar status</div><div class="status-grid">${statuses.map(s=>`<button class="status-btn ${s===o.status?'active':''}" onclick="mudarStatus('${o.id}','${s}')">${s}</button>`).join('')}</div></div><div class="actions"><button class="btn yellow" onclick="gerarOrcamentoPDF('${o.id}')">🧾 Orçamento PDF</button><button class="btn" onclick="financeiroOS('${o.id}')">＋ Lançar recebimento</button><button class="btn light" onclick="ordens()">Voltar</button></div>`}
window.mudarStatus=async(id,s)=>{const {error}=await supabase.from('ordens_servico').update({status:s}).eq('id',id);if(error)return alert(error.message);await loadDB();verOS(id)};
function ordens(){app.innerHTML='<div class="row"><h2>Ordens de Serviço</h2><button class="btn yellow" onclick="novaOS()">＋</button></div><input placeholder="🔎 Pesquisar OS, cliente ou equipamento..." oninput="filtraOS(this.value)"><div id="oslist" class="list"></div>';filtraOS('')};function filtraOS(q){const s=(q||'').toLowerCase();const a=db.os.filter(o=>{const c=cliente(o.cliente_id),e=equip(o.equipamento_id);return (String(o.numero)+' '+(c?.nome||'')+' '+(e?.modelo||'')+' '+(o.status||'')).toLowerCase().includes(s)});$('oslist').innerHTML=a.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${esc(cliente(o.cliente_id)?.nome||'-')}</span></div><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<div class="card small">Nenhuma OS.</div>'};window.ordens=ordens;window.filtraOS=filtraOS;
function quoteItems(q){try{let x=JSON.parse(q||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function orcamentos(){const groups=statuses;app.innerHTML=`<div class="row"><h2>Orçamentos</h2></div><div class="small" style="margin-bottom:10px">Os orçamentos seguem o status da OS e ficam organizados automaticamente.</div><div class="list">${groups.map(s=>{const a=db.os.filter(o=>o.status===s);return `<div class="item" onclick="abrirPastaOrc('${s}')"><div><b>📁 ${s}</b><br><span class="small">${a.length} orçamento(s)</span></div><span>›</span></div>`}).join('')}</div>`}
window.orcamentos=orcamentos;window.abrirPastaOrc=s=>{const a=db.os.filter(o=>o.status===s);app.innerHTML=`<div class="row"><h2>📁 ${s}</h2><button class="btn light" onclick="orcamentos()">Voltar</button></div><div class="list">${a.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${esc(cliente(o.cliente_id)?.nome||'-')}</span></div><button class="btn" onclick="event.stopPropagation();gerarOrcamentoPDF('${o.id}')">PDF</button></div>`).join('')||'<div class="card small">Pasta vazia.</div>'}</div>`};
window.gerarOrcamentoPDF=async id=>{await loadDB();const o=db.os.find(x=>x.id===id),c=cliente(o?.cliente_id),e=equip(o?.equipamento_id);if(!o)return;const items=osItens(o),total=items.reduce((s,x)=>s+Number(x.valor||0)*Number(x.qtd||0),0),m=parseMeta(o);const rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.descricao)}</td><td>${money(x.valor)}</td><td>${x.qtd}</td><td>${money(Number(x.valor)*Number(x.qtd))}</td></tr>`).join('');const win=window.open('','_blank');if(!win)return alert('Permita pop-ups para gerar o PDF.');win.document.write(`<html><head><title>Orçamento OS ${o.numero}</title><style>body{font-family:Arial;color:#172033;margin:30px}h1{font-size:24px;margin:0}h1 span{color:#d9a900}.top{display:flex;justify-content:space-between;border-bottom:3px solid #d9a900;padding-bottom:14px}.box{background:#f5f7f9;border:1px solid #e1e6ea;border-radius:8px;padding:12px;margin-top:12px}.title{font-weight:800;margin-bottom:6px}.fault{min-height:55px}.diag{min-height:70px}table{width:100%;border-collapse:collapse;margin-top:8px}th{background:#172033;color:#fff;padding:9px;text-align:left;font-size:12px}td{padding:9px;border-bottom:1px solid #ddd;font-size:12px}.total{margin-top:12px;text-align:right;font-size:22px;font-weight:800;border:2px solid #172033;padding:12px;border-radius:8px}.muted{color:#667085;font-size:11px} @media print{body{margin:12mm}.no-print{display:none}}</style></head><body><div class="top"><div><h1>TECMAZ <span>AUTOMAÇÃO</span></h1><div class="muted">Automação Industrial • Manutenção e Reparos</div></div><div style="text-align:right"><b>ORÇAMENTO – OS ${String(o.numero).padStart(5,'0')}</b><br>${new Date(o.data+'T00:00:00').toLocaleDateString('pt-BR')}<br><span class="muted">Validade: 15 dias</span></div></div><div class="box"><div class="title">DADOS DO CLIENTE</div><b>${esc(c?.nome||'-')}</b><br>${esc(c?.telefone||'')} • ${esc(c?.email||'')}<br>${esc(c?.endereco||'')} ${esc(c?.cidade||'')} ${esc(c?.uf||'')}</div><div class="box"><div class="title">EQUIPAMENTO</div>${esc(e?.fabricante||'')} ${esc(e?.modelo||'')} • ${esc(e?.tipo||'')} • ${esc(e?.potencia||'')} • ${esc(e?.tensao||'')} • SN ${esc(e?.numero_serie||'-')}</div><div class="box fault"><div class="title">DEFEITO RELATADO</div>${esc(o.defeito||'-').replace(/\n/g,'<br>')}</div><div class="box diag"><div class="title">DIAGNÓSTICO TÉCNICO</div>${esc(o.diagnostico||'-').replace(/\n/g,'<br>')}</div><div class="box"><div class="title">ITENS DO ORÇAMENTO</div><table><tr><th>Item</th><th>Descrição</th><th>Valor unitário</th><th>Quantidade</th><th>Subtotal</th></tr>${rows||'<tr><td colspan="5">Nenhum item informado.</td></tr>'}</table></div><div class="total">TOTAL: ${money(total)}</div><div class="box"><div class="title">OBSERVAÇÕES / CONDIÇÕES</div>${esc(m.condicoes||'-').replace(/\n/g,'<br>')}</div><p class="muted">Documento gerado pelo sistema Tecmaz Automação.</p><button class="no-print" onclick="window.print()">🖨️ Salvar / Imprimir PDF</button></body></html>`);win.document.close();setTimeout(()=>win.print(),400)};
function financeiro(){const ent=db.financeiro.filter(x=>x.tipo==='Receber').reduce((s,x)=>s+Number(x.valor||0),0),sa=db.financeiro.filter(x=>x.tipo==='Pagar').reduce((s,x)=>s+Number(x.valor||0),0),rec=db.financeiro.filter(x=>x.tipo==='Receber'&&x.status!=='Pago').reduce((s,x)=>s+Number(x.valor||0),0);app.innerHTML=`<div class="row"><h2>💰 Caixa</h2><button class="btn yellow" onclick="novoLancamento()">＋ Lançamento</button></div><div class="stat-grid"><div class="stat"><div class="small">Entradas</div><div class="n money-in">${money(ent)}</div></div><div class="stat"><div class="small">Saídas</div><div class="n money-out">${money(sa)}</div></div><div class="stat"><div class="small">A receber</div><div class="n money-open">${money(rec)}</div></div></div><div class="card"><h3>Saldo movimentado</h3><div style="font-size:25px;font-weight:800">${money(ent-sa)}</div></div><h3>Movimentações</h3><div class="list">${db.financeiro.map(x=>`<div class="item"><div><b>${esc(x.descricao)}</b><br><span class="small">${esc(x.tipo)} • ${esc(x.status||'Pendente')} ${x.vencimento?'• '+x.vencimento:''}</span></div><b class="${x.tipo==='Receber'?'money-in':'money-out'}">${x.tipo==='Receber'?'+':'-'} ${money(x.valor)}</b></div>`).join('')||'<div class="card small">Nenhuma movimentação.</div>'}</div>`}
window.financeiro=financeiro;window.financeiroOS=id=>{const o=db.os.find(x=>x.id===id),c=cliente(o?.cliente_id),items=osItens(o),total=items.reduce((s,x)=>s+Number(x.valor||0)*Number(x.qtd||0),0);app.innerHTML=`<div class="row"><h2>Novo recebimento</h2><button class="btn light" onclick="verOS('${id}')">Voltar</button></div><div class="card"><div class="small">OS ${String(o.numero).padStart(5,'0')} • ${esc(c?.nome||'-')}</div><h3>${money(total)}</h3><label>Descrição</label><input id="fdesc" value="Recebimento OS ${String(o.numero).padStart(5,'0')}"><label>Valor</label><input id="fval" type="number" step="0.01" value="${total}"><label>Status</label><select id="fstatus"><option>Pendente</option><option>Pago</option></select><label>Data de pagamento</label><input id="fpag" type="date" value="${today()}"><button class="btn yellow full" onclick="salvarFinanceiro('${id}')">Salvar no caixa</button></div>`};window.salvarFinanceiro=async osId=>{const o=db.os.find(x=>x.id===osId),{error}=await supabase.from('financeiro').insert({cliente_id:o.cliente_id,os_id:osId,tipo:'Receber',descricao:$('fdesc').value,valor:Number($('fval').value||0),pagamento:$('fstatus').value==='Pago'?$('fpag').value:null,status:$('fstatus').value});if(error)return alert(error.message);await loadDB();financeiro()};window.novoLancamento=()=>{app.innerHTML=`<div class="row"><h2>Novo lançamento</h2><button class="btn light" onclick="financeiro()">Voltar</button></div><div class="card"><label>Tipo</label><select id="ftipo"><option>Receber</option><option>Pagar</option></select><label>Descrição *</label><input id="fdesc"><label>Valor</label><input id="fval" type="number" step="0.01"><label>Vencimento</label><input id="fven" type="date"><label>Status</label><select id="fstatus"><option>Pendente</option><option>Pago</option></select><button class="btn yellow full" onclick="salvarLancamento()">Salvar</button></div>`};window.salvarLancamento=async()=>{if(!$('fdesc').value.trim())return alert('Informe a descrição.');const {error}=await supabase.from('financeiro').insert({tipo:$('ftipo').value,descricao:$('fdesc').value.trim(),valor:Number($('fval').value||0),vencimento:$('fven').value||null,status:$('fstatus').value});if(error)return alert(error.message);await loadDB();financeiro()};
function mais(){app.innerHTML='<h2>Mais</h2><div class="list"><div class="item" onclick="orcamentos()">🧾 Orçamentos ›</div><div class="item" onclick="oficina()">📦 Equipamentos na oficina ›</div><div class="item" onclick="sair()">🚪 Sair da conta</div></div>'}window.mais=mais;function oficina(){const a=db.os.filter(o=>o.local==='Oficina'&&o.status!=='Finalizada'&&o.status!=='Cancelada');app.innerHTML='<div class="row"><h2>📦 Oficina</h2><button class="btn light" onclick="mais()">Voltar</button></div><div class="list">'+(a.map(o=>`<div class="item" onclick="verOS('${o.id}')"><div><b>OS ${String(o.numero).padStart(5,'0')}</b><br><span class="small">${esc(cliente(o.cliente_id)?.nome||'-')}</span></div><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<div class="card small">Nenhum equipamento na oficina.</div>')+'</div>'}window.oficina=oficina;
supabase.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s){showApp();try{await loadDB();home()}catch(e){alert('Erro ao carregar: '+e.message)}}else showLogin()});const {data:{session:s}}=await supabase.auth.getSession();session=s;if(session){showApp();try{await loadDB();home()}catch(e){alert('Erro ao carregar: '+e.message)}}else showLogin();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
