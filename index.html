window.mostrarCadastro=()=>{$('authTitle').textContent='Criar acesso';$('authBtn').textContent='Criar conta';$('authBtn').onclick=cadastrar};window.entrar=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPass').value});if(error)$('authMsg').textContent=error.message};window.cadastrar=async()=>{const email=$('authEmail').value.trim(),password=$('authPass').value;if(password.length<6)return $('authMsg').textContent='Use uma senha com pelo menos 6 caracteres.';const {error}=await supabase.auth.signUp({email,password});$('authMsg').textContent=error?error.message:'Conta criada. Confirme o e-mail se solicitado.'};window.sair=async()=>supabase.auth.signOut();

><div class="small">Saldo</div><b>${money(ent-sa)}</b></div></div></div><div class="tz16-card"><h3>OS recentes</h3>${recent.map(o=>`<div class="tz16-status" onclick="verOS('${o.id}')"><span>OS ${String(o.numero).padStart(5,'0')}<br><span class="small">${esc(cliente(o.cliente_id)?.nome||'-')}</span></span><span class="badge ${statusCls(o.status)}">${esc(o.status)}</span></div>`).join('')||'<span class="small">Nenhuma OS cadastrada.</span>'}</div></div>`}

window.salvarCliente=async id=>{const nome=$('cnome').value.trim();if(!nome)return alert('Informe o nome.');const payload={tipo:$('ctipo').value,nome,cpf_cnpj:$('ccnpj').value.trim(),telefone:$('ctel').value.trim(),email:$('cemail').value.trim(),endereco:$('cend').value.trim(),cidade:$('ccidade').value.trim(),uf:$('cuf').value.trim().toUpperCase(),observacoes:$('cobs').value.trim()};const {error}=id?await supabase.from('clientes').update(payload).eq('id',id):await supabase.from('clientes').insert(payload);if(error)return alert(error.message);await loadDB();clientes()};window.editarCliente=id=>novoCliente(id);

window.salvarEdicaoEquipamento=async function(id,cid){
  const tipo=$('etipo').value.trim();
  if(!tipo){alert('Informe o tipo.');return;}
  const {error}=await supabase.from('equipamentos').update({
    tipo:tipo,fabricante:$('efab').value.trim(),modelo:$('emod').value.trim(),
    potencia:$('epot').value.trim(),tensao:$('eten').value.trim(),
    numero_serie:$('eserie').value.trim(),local_instalacao:$('elocal').value.trim(),
    observacoes:$('eobs').value.trim()
  }).eq('id',id);
  if(error){alert(error.message);return;}
  await loadDB(); verCliente(cid);
};

(function(){
  if(!history.state || !history.state.tecmazScreen){
    const initial=localStorage.getItem('tecmaz_screen')||'home';
    history.replaceState({tecmazScreen:initial},'',location.pathname+location.search+'#'+initial);
  }
  window.addEventListener('popstate',function(ev){
    const target=(ev.state&&ev.state.tecmazScreen)||'home';
    if(target==='home'){
      try{localStorage.setItem('tecmaz_screen','home')}catch(e){}
      home();
    }else{
      try{localStorage.setItem('tecmaz_screen','home')}catch(e){}
      history.replaceState({tecmazScreen:'home'},'',location.pathname+location.search+'#home');
      home();
    }
  });
})();
